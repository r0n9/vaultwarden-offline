<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>02 · 只有 placeholder</title>
<style>body{font-family:system-ui;max-width:420px;margin:40px auto;padding:0 16px}
input{width:100%;padding:8px;margin:8px 0;box-sizing:border-box}</style></head>
<body>
<h1>02 · 只有 placeholder</h1>
<p>没有任何 label，字段语义只能从 placeholder 与 name 推断。这是现代站点最常见的形态。</p>
<form action="/signin" method="post">
  <input type="text" name="email" placeholder="邮箱地址">
  <input type="password" name="pwd" placeholder="请输入密码">
  <button type="submit">继续</button>
</form>
<p><a href="index.html">← 返回索引</a></p>
</body></html>
