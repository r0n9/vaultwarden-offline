name: Release

# 打 tag `v*`（如 v2026.8.1）时触发：构建、打包、发布到 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tests
        run: npm test

      - name: Build Chrome / Edge / Opera
        # MV3 产物相同（同一份 manifest），打包后改名保留 dist 供 Firefox 构建。
        run: |
          npm run build
          mv dist dist-chrome
          cd dist-chrome && zip -r ../vaultwarden-offline-${{ github.ref_name }}-chrome.zip .

      - name: Build Firefox
        # Firefox 用事件页 + gecko 专属设置，manifest 差异在构建期注入。
        run: |
          npm run build:firefox
          cd dist && zip -r ../vaultwarden-offline-${{ github.ref_name }}-firefox.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vaultwarden-offline-*.zip
          generate_release_notes: true
